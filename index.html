<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            0: '#161b22',
                            1: '#0e4429',
                            2: '#006d32',
                            3: '#26a641',
                            4: '#39d353'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; background-color: #0d1117; color: #c9d1d9; }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .modal-enter { animation: modalIn 0.15s ease-out forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .number-pop { animation: popNum 0.1s ease-out; }
        @keyframes popNum {
            0% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased pb-24" x-data="trackerApp()" x-init="initApp()">

    <!-- Minimal Header -->
    <header class="sticky top-0 z-30 px-4 py-3 max-w-md mx-auto flex items-center justify-between bg-[#0d1117]">
        <div class="flex space-x-1 items-center">
            <button @click="setViewMode('week')" :class="viewMode === 'week' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Week</button>
            <button @click="setViewMode('month')" :class="viewMode === 'month' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Month</button>
            <button @click="setViewMode('year')" :class="viewMode === 'year' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Year</button>
            
            <!-- Habit Selector Dropdown -->
            <div class="relative ml-1" x-data="{ openHabitMenu: false }">
                <button @click="openHabitMenu = !openHabitMenu" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#21262d] text-white hover:bg-[#30363d] transition flex items-center space-x-1.5 border border-[#30363d]">
                    <span x-text="activeHabitName"></span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
                </button>

                <!-- iOS-style Popover Menu -->
                <div x-show="openHabitMenu" @click.away="openHabitMenu = false" class="absolute left-0 mt-2 w-48 bg-[#161b22] border border-[#30363d] rounded-2xl shadow-2xl p-1.5 z-50 space-y-1 modal-enter" x-cloak>
                    <template x-for="h in habits" :key="h.id">
                        <div @click="selectHabit(h.id); openHabitMenu = false" 
                             class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition"
                             :class="activeHabitId === h.id ? 'bg-[#21262d] text-white font-bold' : 'text-zinc-400 hover:text-white hover:bg-[#21262d]/50'">
                            <span x-text="h.name"></span>
                            <span x-show="activeHabitId === h.id" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        </div>
                    </template>
                    <div class="border-t border-[#30363d] my-1"></div>
                    <div @click="selectHabit('all'); openHabitMenu = false" 
                         class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition"
                         :class="activeHabitId === 'all' ? 'bg-[#21262d] text-white font-bold' : 'text-zinc-400 hover:text-white hover:bg-[#21262d]/50'">
                        <span>All</span>
                        <span x-show="activeHabitId === 'all'" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    </div>
                    <div class="border-t border-[#30363d] my-1"></div>
                    <button @click="openHabitManager = true; openHabitMenu = false" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-emerald-400 hover:bg-[#21262d] transition flex items-center space-x-2">
                        <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                        <span>Управление делами...</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Cloud sync status indicator -->
            <span class="w-2.5 h-2.5 rounded-full" :class="syncStatusClass" :title="syncStatusText"></span>
            <button @click="openSettings = true" class="p-2 text-zinc-400 hover:text-white transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-4">

        <!-- Date Navigation Bar -->
        <div class="flex items-center justify-between px-2 py-1">
            <button @click="shiftDate(-1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="text-sm font-semibold text-white" x-text="dateRangeTitle"></span>
            <button @click="shiftDate(1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- UNIFORM HEATMAP CONTAINER (Exact same 12-column or uniform square size across all views) -->
        <div class="px-2 space-y-6" id="heatmap-container">
            
            <!-- IF SINGLE HABIT -->
            <template x-if="activeHabitId !== 'all'">
                <div class="space-y-3">
                    <!-- WEEK VIEW -->
                    <template x-if="viewMode === 'week'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="day in currentWeekDays" :key="day.dateStr">
                                <div @click="selectDay(day.dateStr)" 
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(day.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="day.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- MONTH VIEW -->
                    <template x-if="viewMode === 'month'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="cell in currentMonthGrid" :key="cell.dateStr || Math.random()">
                                <div @click="selectDay(cell.dateStr)"
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(cell.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="cell.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- YEAR VIEW -->
                    <template x-if="viewMode === 'year'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="day in yearDaysList" :key="day.dateStr">
                                <div @click="selectDay(day.dateStr)"
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(day.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="day.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- IF ALL HABITS (SUMMARY VIEW) -->
            <template x-if="activeHabitId === 'all'">
                <div class="space-y-6">
                    <template x-for="h in habits" :key="h.id">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between px-1">
                                <span class="text-xs font-bold text-white" x-text="h.name"></span>
                            </div>
                            
                            <!-- WEEK VIEW FOR HABIT -->
                            <template x-if="viewMode === 'week'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="day in getHabitWeekDays(h.id)" :key="day.dateStr">
                                        <div @click="selectDayForHabit(h.id, day.dateStr)" 
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + day.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- MONTH VIEW FOR HABIT -->
                            <template x-if="viewMode === 'month'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="cell in getHabitMonthGrid(h.id)" :key="cell.dateStr || Math.random()">
                                        <div @click="selectDayForHabit(h.id, cell.dateStr)"
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + cell.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- YEAR VIEW FOR HABIT -->
                            <template x-if="viewMode === 'year'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="day in getHabitYearDays(h.id)" :key="day.dateStr">
                                        <div @click="selectDayForHabit(h.id, day.dateStr)"
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + day.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

        </div>

    </main>

    <!-- DAY DETAIL MODAL -->
    <div x-show="openModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="saveAndCloseModal()" class="bg-[#161b22] border border-[#30363d] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl overflow-hidden max-h-[85vh] flex flex-col modal-enter">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
                <h3 class="font-bold text-white text-base" x-text="formatDateHuman(selectedDate)"></h3>
                
                <!-- Three dots menu -->
                <div class="relative" x-data="{ openMenu: false }">
                    <button @click="openMenu = !openMenu" class="p-1.5 rounded-xl bg-[#21262d] text-zinc-300 hover:text-white transition">
                        <i data-lucide="more-vertical" class="w-5 h-5"></i>
                    </button>
                    <div x-show="openMenu" @click.away="openMenu = false" class="absolute right-0 mt-2 w-36 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl p-1 z-50 modal-enter" x-cloak>
                        <button @click="clearDayData(); openMenu = false" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-red-400 hover:bg-[#21262d] transition">
                            Очистить день
                        </button>
                    </div>
                </div>
            </div>

            <!-- Exercises List -->
            <div class="space-y-4 overflow-y-auto pr-1 flex-1 py-1">

                <template x-for="(ex, exIndex) in activeDayExercises" :key="exIndex">
                    <div class="bg-[#0d1117] border border-[#30363d] p-3.5 rounded-2xl space-y-3 modal-enter">
                        
                        <!-- Exercise Header / Input -->
                        <div class="flex items-center justify-between">
                            <input type="text" x-model="ex.name" placeholder="Название упражнения/дела..." class="bg-[#161b22] border border-[#30363d] text-white text-sm font-semibold rounded-xl px-3.5 py-1.5 focus:outline-none focus:border-emerald-500 w-2/3">
                            
                            <div class="flex items-center space-x-2 relative" x-data="{ openExMenu: false }">
                                <button @click="openExMenu = !openExMenu" class="text-zinc-400 hover:text-white p-1 transition">
                                    <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                                </button>
                                
                                <div x-show="openExMenu" @click.away="openExMenu = false" class="absolute right-0 mt-2 w-44 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl p-1 z-50 modal-enter" x-cloak>
                                    <button @click="isExerciseInTemplates(ex.name) ? null : saveAsTemplate(ex); openExMenu = false" 
                                            class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-between transition"
                                            :class="isExerciseInTemplates(ex.name) ? 'text-zinc-500 cursor-default' : 'text-emerald-400 hover:bg-[#21262d]'">
                                        <span x-text="isExerciseInTemplates(ex.name) ? 'В шаблонах ✓' : 'Сохранить в шаблоны'"></span>
                                    </button>
                                    <button @click="removeExercise(exIndex); openExMenu = false" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-red-400 hover:bg-[#21262d] transition">
                                        Удалить упражнение
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Sets List -->
                        <div class="space-y-2 pt-1">
                            <template x-for="(set, setIndex) in ex.setsList" :key="setIndex">
                                <div class="flex items-center justify-between bg-[#161b22] border border-[#30363d] px-3 py-2 rounded-xl">
                                    <span class="text-xs text-zinc-400 font-medium">Подход <span x-text="setIndex + 1"></span></span>
                                    
                                    <div class="flex items-center space-x-3">
                                        <!-- Clean number without borders -->
                                        <div @click="openPicker(exIndex, setIndex)"
                                             class="cursor-pointer text-base font-bold text-white hover:text-emerald-400 transition select-none px-2 py-1"
                                             title="Нажми для изменения">
                                            <span x-text="set.reps"></span> <span x-text="activeHabitUnit"></span>
                                        </div>

                                        <!-- Delete set -->
                                        <button @click="removeSet(exIndex, setIndex)" class="text-zinc-600 hover:text-red-400 p-1">
                                            <i data-lucide="minus-circle" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Add Set Button (+) -->
                            <button @click="addSet(exIndex)" class="w-full py-2 bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] rounded-xl text-zinc-300 flex items-center justify-center transition active:scale-95">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>

                    </div>
                </template>

                <!-- Action buttons row (Templates + Add Exercise) -->
                <div class="flex space-x-2 pt-1">
                    <!-- Templates Dropdown Button -->
                    <div class="relative flex-1" x-data="{ openTemplates: false }">
                        <button @click="openTemplates = !openTemplates; $nextTick(() => lucide.createIcons())" class="w-full py-3 bg-[#161b22] border border-[#30363d] hover:bg-[#21262d] rounded-2xl text-xs font-semibold text-zinc-300 flex items-center justify-center space-x-2 transition active:scale-95">
                            <i data-lucide="bookmark" class="w-4 h-4 text-zinc-400"></i>
                            <span>Шаблоны</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform duration-200" :class="openTemplates ? 'rotate-180' : ''"></i>
                        </button>

                        <div x-show="openTemplates" @click.away="openTemplates = false" class="absolute left-0 right-0 bottom-full mb-2 bg-[#161b22] border border-[#30363d] rounded-2xl shadow-2xl p-2 z-50 space-y-1 modal-enter" x-cloak>
                            <template x-if="activeHabitTemplates.length === 0">
                                <div class="text-center py-2 text-xs text-zinc-500">Нет сохраненных шаблонов</div>
                            </template>
                            <template x-for="(t, tIdx) in activeHabitTemplates" :key="tIdx">
                                <div class="flex items-center justify-between px-3 py-2 rounded-xl text-xs text-white hover:bg-[#21262d] transition">
                                    <span @click="addExerciseFromTemplate(t); openTemplates = false; $nextTick(() => lucide.createIcons())" class="cursor-pointer font-medium flex-1 truncate mr-2" x-text="t.name"></span>
                                    <button @click="removeTemplate(tIdx)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-red-500/10 text-zinc-400 hover:text-red-400 text-base font-bold transition">×</button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Add Exercise Button -->
                    <button @click="addExerciseRow()" class="w-14 py-3 bg-[#161b22] border border-[#30363d] hover:bg-[#21262d] rounded-2xl text-white flex items-center justify-center transition active:scale-95" title="Новое упражнение">
                        <i data-lucide="plus" class="w-5 h-5 text-zinc-300"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- FULLSCREEN BLUR DRAG REPS PICKER OVERLAY -->
    <div x-show="openPickerModal" 
         @touchstart="startPickerDrag($event)" 
         @mousedown="startPickerDrag($event)"
         class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md select-none cursor-ns-resize" 
         x-cloak>
        
        <!-- Big white number with pop animation -->
        <div class="text-center">
            <div class="text-8xl font-black text-white transition-transform duration-75" :class="animatingPop ? 'number-pop' : ''" x-text="pickerCurrentVal"></div>
        </div>

        <!-- Done checkmark button in bottom-right corner -->
        <div class="absolute bottom-8 right-8 z-[70]">
            <button @click.stop="closePicker()" class="w-16 h-16 bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-zinc-400 hover:text-white rounded-full flex items-center justify-center shadow-2xl transition active:scale-90">
                <i data-lucide="check" class="w-8 h-8 stroke-[3]"></i>
            </button>
        </div>
    </div>

    <!-- SETTINGS & CLOUD SYNC MODAL -->
    <div x-show="openSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openSettings = false" class="bg-[#161b22] border border-[#30363d] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl modal-enter">
            <div class="flex items-center justify-between border-b border-[#30363d] pb-3">
                <h3 class="font-bold text-white text-base">Надежность и синхронизация</h3>
                <button @click="openSettings = false" class="p-1 rounded-full bg-[#21262d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4 text-xs text-zinc-300 leading-relaxed">
                <!-- GitHub Gist Cloud Sync explanation -->
                <div class="bg-[#0d1117] border border-[#30363d] p-3 rounded-xl space-y-2">
                    <div class="font-bold text-white flex items-center justify-between">
                        <span>☁️ Облако GitHub Gist</span>
                        <span class="text-[10px] text-emerald-400 font-normal">100% надежно</span>
                    </div>
                    <p class="text-zinc-400">
                        Чтобы данные никогда не потерялись и синхронизировались между телефоном и ПК, вставь свой <strong class="text-white">GitHub Token</strong> (PAT) с правами доступа к gist.
                    </p>
                    <input type="password" x-model="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-[#161b22] border border-[#30363d] text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-emerald-500 font-mono text-[11px]">
                    <div class="flex space-x-2 pt-1">
                        <button @click="saveGithubToken()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">
                            Подключить
                        </button>
                        <button @click="syncWithGist()" class="px-3 py-2 bg-[#21262d] hover:bg-[#30363d] text-white font-medium rounded-lg transition" title="Синхронизировать сейчас">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Local backup -->
                <div class="flex space-x-2 pt-1">
                    <button @click="exportData()" class="flex-1 py-2 rounded-xl bg-[#0d1117] border border-[#30363d] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Скачать файл</span>
                    </button>
                    <label class="flex-1 py-2 rounded-xl bg-[#0d1117] border border-[#30363d] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span>Загрузить</span>
                        <input type="file" @change="importData" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <div class="border-t border-[#30363d] pt-3 flex justify-end">
                <button @click="openSettings = false" class="px-4 py-2 rounded-xl bg-[#21262d] border border-[#30363d] text-white text-xs font-bold">
                    Готово
                </button>
            </div>
        </div>
    </div>

    <!-- HABITS & ACTIVITIES MANAGER MODAL (iOS Style) -->
    <div x-show="openHabitManager" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openHabitManager = false" class="bg-[#161b22] border border-[#30363d] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl modal-enter">
            <div class="flex items-center justify-between border-b border-[#30363d] pb-3">
                <h3 class="font-bold text-white text-base flex items-center space-x-2">
                    <i data-lucide="list-checks" class="w-5 h-5 text-emerald-400"></i>
                    <span>Управление делами и привычками</span>
                </h3>
                <button @click="openHabitManager = false" class="p-1.5 rounded-full bg-[#21262d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Add habit input & unit -->
            <div class="flex space-x-2">
                <input type="text" x-model="newHabitName" @keyup.enter="addHabitItem()" placeholder="Название дела..." class="flex-1 bg-[#0d1117] border border-[#30363d] text-white text-xs px-3 py-2 rounded-xl focus:outline-none focus:border-emerald-500">
                <input type="text" x-model="newHabitUnit" placeholder="Ед. (пов., мин...)" class="w-24 bg-[#0d1117] border border-[#30363d] text-white text-xs px-3 py-2 rounded-xl focus:outline-none focus:border-emerald-500 text-center">
                <button @click="addHabitItem()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition">
                    +
                </button>
            </div>

            <!-- Habits list with rename & delete -->
            <div class="space-y-2 overflow-y-auto max-h-[50vh] pr-1">
                <template x-for="(habit, hIndex) in habits" :key="habit.id">
                    <div class="flex items-center justify-between bg-[#0d1117] border border-[#30363d] px-3.5 py-2.5 rounded-xl">
                        <span class="text-sm font-medium text-white" x-text="habit.name + ' (' + (habit.unit || 'пов.') + ')'"></span>
                        <div class="flex items-center space-x-1">
                            <button @click="renameHabit(hIndex)" class="text-zinc-400 hover:text-white p-1.5 rounded-lg bg-[#161b22] border border-[#30363d]" title="Переименовать">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button @click="removeHabitItem(hIndex)" class="text-zinc-500 hover:text-red-400 p-1.5 rounded-lg bg-[#161b22] border border-[#30363d]" title="Удалить">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <div class="border-t border-[#30363d] pt-3 flex justify-end">
                <button @click="openHabitManager = false" class="px-4 py-2 rounded-xl bg-[#21262d] border border-[#30363d] text-white text-xs font-bold">
                    Готово
                </button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        function trackerApp() {
            return {
                viewMode: 'year',
                currentDate: new Date(),
                todayStr: '',
                openModal: false,
                openSettings: false,
                openPickerModal: false,
                openHabitManager: false,
                selectedDate: '',
                activeDayExercises: [],
                
                habits: [{ id: 'workout_default', name: 'Тренировки', unit: 'пов.' }],
                activeHabitId: 'workout_default',
                modalHabitId: null,
                allData: {},
                newHabitName: '',
                newHabitUnit: 'пов.',

                githubToken: '',
                gistId: '',
                syncStatus: 'local',

                pickerExIndex: null,
                pickerSetIndex: null,
                pickerCurrentVal: 0,
                pickerStartY: 0,
                pickerStartVal: 0,
                pickerDragging: false,
                animatingPop: false,

                initApp() {
                    const savedAll = localStorage.getItem('gym_all_habits_data_v3');
                    if (savedAll) {
                        try { this.allData = JSON.parse(savedAll); } catch (e) {}
                    } else {
                        // Migrate legacy single workout data
                        const legacy = localStorage.getItem('gym_streak_data_v7');
                        if (legacy) {
                            try { this.allData['workout_default'] = JSON.parse(legacy); } catch (e) {}
                        }
                    }

                    const savedHabits = localStorage.getItem('gym_habits_list_v3');
                    if (savedHabits) {
                        try { this.habits = JSON.parse(savedHabits); } catch (e) {}
                    }

                    const savedActive = localStorage.getItem('gym_active_habit_v3');
                    if (savedActive && (savedActive === 'all' || this.habits.some(h => h.id === savedActive))) {
                        this.activeHabitId = savedActive;
                    } else if (this.habits.length > 0) {
                        this.activeHabitId = this.habits[0].id;
                    }

                    const savedView = localStorage.getItem('gym_view_mode_v3');
                    if (savedView) {
                        this.viewMode = savedView;
                    }

                    this.githubToken = localStorage.getItem('gym_github_token') || '';
                    this.gistId = localStorage.getItem('gym_gist_id') || '';

                    const today = new Date();
                    this.todayStr = this.formatDateIso(today);
                    this.selectedDate = this.todayStr;

                    this.$nextTick(() => {
                        lucide.createIcons();
                        this.scrollToToday();
                    });

                    this.$watch('viewMode', () => {
                        this.$nextTick(() => {
                            lucide.createIcons();
                            this.scrollToToday();
                        });
                    });

                    if (this.githubToken) {
                        this.syncWithGist();
                    }

                    window.addEventListener('mousemove', (e) => this.onPickerDrag(e.clientY));
                    window.addEventListener('mouseup', () => this.stopPickerDrag());
                    window.addEventListener('touchmove', (e) => {
                        if (this.pickerDragging) {
                            if (e.cancelable) e.preventDefault();
                            if (e.touches.length > 0) {
                                this.onPickerDrag(e.touches[0].clientY);
                            }
                        }
                    }, { passive: false });
                    window.addEventListener('touchend', () => this.stopPickerDrag());
                },

                get syncStatusClass() {
                    switch(this.syncStatus) {
                        case 'synced': return 'bg-emerald-500';
                        case 'syncing': return 'bg-amber-500 animate-pulse';
                        case 'error': return 'bg-red-500';
                        default: return 'bg-zinc-600';
                    }
                },

                get syncStatusText() {
                    switch(this.syncStatus) {
                        case 'synced': return 'Синхронизировано с GitHub Gist';
                        case 'syncing': return 'Синхронизация...';
                        case 'error': return 'Ошибка синхронизации';
                        default: return 'Локальное хранилище';
                    }
                },

                saveGithubToken() {
                    localStorage.setItem('gym_github_token', this.githubToken.trim());
                    alert('Токен сохранен!');
                    this.syncWithGist();
                },

                async syncWithGist() {
                    if (!this.githubToken) return;
                    this.syncStatus = 'syncing';
                    try {
                        if (!this.gistId) {
                            let res = await fetch('https://api.github.com/gists', {
                                headers: { 'Authorization': `token ${this.githubToken}` }
                            });
                            if (res.ok) {
                                let gists = await res.json();
                                let existing = gists.find(g => g.description === 'GymTrackerData');
                                if (existing) {
                                    this.gistId = existing.id;
                                    localStorage.setItem('gym_gist_id', this.gistId);
                                }
                            }
                        }

                        if (this.gistId) {
                            let res = await fetch(`https://api.github.com/gists/${this.gistId}`, {
                                headers: { 'Authorization': `token ${this.githubToken}` }
                            });
                            if (res.ok) {
                                let data = await res.json();
                                if (data.files && data.files['workouts.json']) {
                                    let remoteState = JSON.parse(data.files['workouts.json'].content);
                                    if (remoteState && remoteState.habits && remoteState.allData) {
                                        this.habits = remoteState.habits;
                                        this.allData = remoteState.allData;
                                         if (remoteState.activeHabitId && this.activeHabitId !== 'all') {
                                             this.activeHabitId = remoteState.activeHabitId;
                                         }
                                        this.saveToStorageLocally();
                                    } else if (remoteState && typeof remoteState === 'object') {
                                        // Legacy single workout format fallback
                                        this.allData['workout_default'] = remoteState;
                                        this.saveToStorageLocally();
                                    }
                                }
                            }
                        } else {
                            let res = await fetch('https://api.github.com/gists', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `token ${this.githubToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    description: 'GymTrackerData',
                                    public: false,
                                    files: {
                                        'workouts.json': {
                                            content: JSON.stringify({
                                                habits: this.habits,
                                                allData: this.allData,
                                                activeHabitId: this.activeHabitId
                                            })
                                        }
                                    }
                                })
                            });
                            if (res.ok) {
                                let data = await res.json();
                                this.gistId = data.id;
                                localStorage.setItem('gym_gist_id', this.gistId);
                            }
                        }
                        this.syncStatus = 'synced';
                    } catch (err) {
                        console.error(err);
                        this.syncStatus = 'error';
                    }
                },

                async pushToGist() {
                    if (!this.githubToken || !this.gistId) return;
                    this.syncStatus = 'syncing';
                    try {
                        let res = await fetch(`https://api.github.com/gists/${this.gistId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `token ${this.githubToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                files: {
                                    'workouts.json': {
                                        content: JSON.stringify({
                                            habits: this.habits,
                                            allData: this.allData,
                                            activeHabitId: this.activeHabitId
                                        })
                                    }
                                }
                            })
                        });
                        if (res.ok) {
                            this.syncStatus = 'synced';
                        } else {
                            const errText = await res.text();
                            console.error('Gist Error:', errText);
                            this.syncStatus = 'error';
                        }
                    } catch (e) {
                        console.error('Gist Exception:', e);
                        this.syncStatus = 'error';
                    }
                },

                scrollToToday() {
                    setTimeout(() => {
                        const el = document.getElementById('today-square');
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                },

                setViewMode(mode) {
                    this.viewMode = mode;
                    this.saveToStorageLocally();
                    this.currentDate = new Date();
                },

                openPicker(exIdx, setIdx) {
                    this.pickerExIndex = exIdx;
                    this.pickerSetIndex = setIdx;
                    this.pickerCurrentVal = Number(this.activeDayExercises[exIdx].setsList[setIdx].reps || 0);
                    this.openPickerModal = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                startPickerDrag(e) {
                    if (e.target.closest('button')) return;
                    if (e.cancelable) e.preventDefault();
                    this.pickerDragging = true;
                    this.pickerStartY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                    this.pickerStartVal = this.pickerCurrentVal;
                },

                onPickerDrag(clientY) {
                    if (!this.pickerDragging) return;
                    let diff = Math.floor((this.pickerStartY - clientY) / 35); 
                    let newVal = this.pickerStartVal + diff;
                    if (newVal < 0) newVal = 0;
                    if (newVal > 999) newVal = 999;
                    
                    if (newVal !== this.pickerCurrentVal) {
                        this.pickerCurrentVal = newVal;
                        this.animatingPop = true;
                        setTimeout(() => this.animatingPop = false, 100);
                    }

                    if (this.pickerExIndex !== null && this.pickerSetIndex !== null) {
                        this.activeDayExercises[this.pickerExIndex].setsList[this.pickerSetIndex].reps = newVal;
                    }
                },

                stopPickerDrag() {
                    this.pickerDragging = false;
                },

                closePicker() {
                    this.openPickerModal = false;
                    this.pickerExIndex = null;
                    this.pickerSetIndex = null;
                },

                saveToStorageLocally() {
                    localStorage.setItem('gym_all_habits_data_v3', JSON.stringify(this.allData));
                    localStorage.setItem('gym_habits_list_v3', JSON.stringify(this.habits));
                    localStorage.setItem('gym_active_habit_v3', this.activeHabitId);
                    localStorage.setItem('gym_view_mode_v3', this.viewMode);
                },

                saveToStorage() {
                    this.saveToStorageLocally();
                    if (this.githubToken && this.gistId) {
                        this.pushToGist();
                    }
                },

                formatDateIso(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },

                formatDateHuman(dateStr) {
                    if (!dateStr) return '';
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const date = new Date(y, m - 1, d);
                    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
                },

                isToday(dateStr) {
                    return dateStr === this.todayStr;
                },

                getIntensity(dateStr) {
                    return this.getIntensityForHabit(this.activeHabitId, dateStr);
                },

                getIntensityForHabit(habitId, dateStr) {
                    const habitWorkouts = this.allData[habitId] || {};
                    const dayExs = habitWorkouts[dateStr];
                    if (!dayExs || !dayExs.length) return 0;
                    let totalReps = 0;
                    dayExs.forEach(ex => {
                        if (ex.setsList) ex.setsList.forEach(s => totalReps += Number(s.reps || 0));
                    });
                    if (totalReps === 0) return 0;
                    if (totalReps <= 25) return 1;
                    if (totalReps <= 60) return 2;
                    if (totalReps <= 100) return 3;
                    return 4;
                },

                getHabitWeekDays(habitId) {
                    let d = new Date(this.currentDate);
                    let dayOfWeek = d.getDay();
                    let distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    d.setDate(d.getDate() + distanceToMonday);

                    let list = [];
                    for (let i = 0; i < 7; i++) {
                        let dateStr = this.formatDateIso(d);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensityForHabit(habitId, dateStr)
                        });
                        d.setDate(d.getDate() + 1);
                    }
                    return list;
                },

                getHabitMonthGrid(habitId) {
                    let y = this.currentDate.getFullYear();
                    let m = this.currentDate.getMonth();
                    let lastDayOfMonth = new Date(y, m + 1, 0);
                    
                    let list = [];
                    for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                        let dateObj = new Date(y, m, i);
                        let dateStr = this.formatDateIso(dateObj);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensityForHabit(habitId, dateStr)
                        });
                    }
                    return list;
                },

                getHabitYearDays(habitId) {
                    let y = this.currentDate.getFullYear();
                    let startDate = new Date(y, 0, 1);
                    let endDate = new Date(y, 11, 31);
                    let list = [];
                    let curr = new Date(startDate);
                    while (curr <= endDate) {
                        let dateStr = this.formatDateIso(curr);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensityForHabit(habitId, dateStr)
                        });
                        curr.setDate(curr.getDate() + 1);
                    }
                    return list;
                },

                // Removed lastActiveHabitBeforeModal as it's no longer needed with modalHabitId.
                selectDayForHabit(habitId, dateStr) { // Called when clicking a day in 'all' view
                    if (!dateStr) return;
                    this.selectedDate = dateStr;
                    this.modalHabitId = habitId;

                    const habitData = this.allData[habitId] || {};
                    const existing = habitData[dateStr];

                    if (existing && existing.length > 0) {
                        this.activeDayExercises = JSON.parse(JSON.stringify(existing));
                    } else {
                        const h = this.habits.find(item => item.id === habitId);
                        this.activeDayExercises = [
                            { name: h ? h.name : 'Тренировки', setsList: [{reps: 0}] }
                        ];
                    }
                    this.openModal = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                isExerciseInTemplates(name) {
                    if (!name) return false;
                    const h = this.habits.find(item => item.id === this.activeHabitId);
                    return h && h.templates && h.templates.some(t => t.name.toLowerCase() === name.trim().toLowerCase());
                },

                get activeHabitTemplates() {
                    const idToUse = this.modalHabitId || (this.activeHabitId === 'all' ? (this.habits[0] ? this.habits[0].id : 'workout_default') : this.activeHabitId);
                    const h = this.habits.find(item => item.id === idToUse);
                    return h && h.templates ? h.templates : [];
                },
                addExerciseFromTemplate(template) {
                    this.activeDayExercises.push({
                        name: template.name,
                        setsList: template.defaultSets ? JSON.parse(JSON.stringify(template.defaultSets)) : [{reps: 0}]
                    });
                    this.$nextTick(() => lucide.createIcons());
                },

                saveAsTemplate(ex) {
                    if (!ex.name.trim()) {
                        alert('Введите название упражнения');
                        return;
                    }
                    const idToUse = this.modalHabitId || (this.activeHabitId === 'all' ? (this.habits[0] ? this.habits[0].id : 'workout_default') : this.activeHabitId);
                    const h = this.habits.find(item => item.id === idToUse);
                    if (h) {
                        if (!h.templates) h.templates = [];
                        h.templates.push({
                            name: ex.name,
                            defaultSets: JSON.parse(JSON.stringify(ex.setsList))
                        });
                        this.saveHabitsConfig();
                        alert('Упражнение сохранено в шаблоны!');
                    }
                },

                removeTemplate(tIndex) {
                    const idToUse = this.modalHabitId || (this.activeHabitId === 'all' ? (this.habits[0] ? this.habits[0].id : 'workout_default') : this.activeHabitId);
                    const h = this.habits.find(item => item.id === idToUse);
                    if (h && h.templates) {
                        if (confirm('Удалить шаблон?')) {
                            h.templates.splice(tIndex, 1);
                            this.saveHabitsConfig();
                        }
                    }
                },

                getColorClass(intensity) {
                    switch (intensity) {
                        case 1: return 'bg-github-1';
                        case 2: return 'bg-github-2';
                        case 3: return 'bg-github-3';
                        case 4: return 'bg-github-4';
                        default: return 'bg-[#161b22]';
                    }
                },

                get dateRangeTitle() {
                    const y = this.currentDate.getFullYear();
                    const m = this.currentDate.getMonth();
                    if (this.viewMode === 'week') return `Week (${y})`;
                    if (this.viewMode === 'month') {
                        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                        return `${months[m]} ${y}`;
                    }
                    return `${y}`;
                },

                shiftDate(direction) {
                    const d = new Date(this.currentDate);
                    if (this.viewMode === 'week') d.setDate(d.getDate() + (direction * 7));
                    else if (this.viewMode === 'month') d.setMonth(d.getMonth() + direction);
                    else d.setFullYear(d.getFullYear() + direction);
                    this.currentDate = d;
                },

                get currentWeekDays() {
                    let d = new Date(this.currentDate);
                    let dayOfWeek = d.getDay();
                    let distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    d.setDate(d.getDate() + distanceToMonday);

                    let list = [];
                    for (let i = 0; i < 7; i++) {
                        let dateStr = this.formatDateIso(d);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensity(dateStr)
                        });
                        d.setDate(d.getDate() + 1);
                    }
                    return list;
                },

                get currentMonthGrid() {
                    let y = this.currentDate.getFullYear();
                    let m = this.currentDate.getMonth();
                    let lastDayOfMonth = new Date(y, m + 1, 0);
                    
                    let list = [];
                    for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                        let dateObj = new Date(y, m, i);
                        let dateStr = this.formatDateIso(dateObj);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensity(dateStr)
                        });
                    }
                    return list;
                },

                get yearDaysList() {
                    let y = this.currentDate.getFullYear();
                    let startDate = new Date(y, 0, 1);
                    let endDate = new Date(y, 11, 31);
                    let list = [];
                    let curr = new Date(startDate);
                    while (curr <= endDate) {
                        let dateStr = this.formatDateIso(curr);
                        list.png ? null : null;
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensity(dateStr)
                        });
                        curr.setDate(curr.getDate() + 1);
                    }
                    return list;
                },

                get workouts() {
                    const id = this.modalHabitId || this.activeHabitId;
                    if (id === 'all') return {}; // В режиме "All" возвращаем пустой объект, так как данные лежат в отдельных делах
                    if (!this.allData[id]) {
                        this.allData[id] = {};
                    }
                    return this.allData[id];
                },
                set workouts(val) {
                    const id = this.modalHabitId || this.activeHabitId;
                    if (id !== 'all') {
                        this.allData[id] = val;
                    }
                },

                get activeHabitName() {
                    if (this.activeHabitId === 'all') return 'All';
                    const h = this.habits.find(item => item.id === this.activeHabitId);
                    return h ? h.name : 'Тренировки';
                },

                get activeHabitUnit() {
                    const idToUse = this.modalHabitId || (this.activeHabitId === 'all' ? (this.habits[0] ? this.habits[0].id : 'workout_default') : this.activeHabitId);
                    const h = this.habits.find(item => item.id === idToUse);
                    return h && h.unit ? h.unit : 'пов.';
                },

                selectHabit(id) {
                    this.activeHabitId = id;
                    this.saveToStorageLocally();
                    this.$nextTick(() => {
                        lucide.createIcons();
                        this.scrollToToday();
                    });
                },

                addHabitItem() {
                    const name = this.newHabitName.trim();
                    if (!name) return;
                    const unit = (this.newHabitUnit || 'пов.').trim();
                    const id = 'habit_' + Date.now();
                    this.habits.push({ id, name, unit });
                    this.newHabitName = '';
                    this.newHabitUnit = 'пов.';
                    this.saveHabitsConfig();
                    this.selectHabit(id);
                    this.$nextTick(() => lucide.createIcons());
                },

                renameHabit(index) {
                    const h = this.habits[index];
                    const newName = prompt('Новое название дела/привычки:', h.name);
                    if (newName !== null && newName.trim()) {
                        h.name = newName.trim();
                        const newUnit = prompt('Единица измерения (пов., мин., стр., раз...):', h.unit || 'пов.');
                        if (newUnit !== null) {
                            h.unit = newUnit.trim() || 'пов.';
                        }
                        this.saveHabitsConfig();
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                removeHabitItem(index) {
                    if (this.habits.length <= 1) {
                        alert('Должно остаться хотя бы одно дело/привычка');
                        return;
                    }
                    const removedId = this.habits[index].id;
                    this.habits.splice(index, 1);
                    if (this.activeHabitId === removedId) {
                        this.selectHabit(this.habits[0].id);
                    }
                    this.saveHabitsConfig();
                },

                saveHabitsConfig() {
                    localStorage.setItem('gym_habits_list_v3', JSON.stringify(this.habits));
                    localStorage.setItem('gym_all_habits_data_v3', JSON.stringify(this.allData));
                },

                saveAndCloseModal() {
                    this.saveDayData();
                },

                selectDay(dateStr) {
                    if (!dateStr) return;
                    this.selectedDate = dateStr;
                    this.modalHabitId = this.activeHabitId === 'all' ? (this.habits[0] ? this.habits[0].id : 'workout_default') : this.activeHabitId;
                    
                    const habitData = this.allData[this.modalHabitId] || {};
                    const existing = habitData[dateStr];

                    if (existing && existing.length > 0) {
                        this.activeDayExercises = JSON.parse(JSON.stringify(existing));
                    } else {
                        const h = this.habits.find(item => item.id === this.modalHabitId);
                        const name = h ? h.name : 'Тренировки';
                        this.activeDayExercises = [
                            { name: name, setsList: [{reps: 0}] }
                        ];
                    }
                    this.openModal = true;
                    document.body.style.overflow = 'hidden';
                    this.$nextTick(() => lucide.createIcons());
                },

                addExerciseRow() {
                    this.activeDayExercises.push({ name: this.activeHabitName, setsList: [{reps: 0}] });
                    this.$nextTick(() => lucide.createIcons());
                },

                removeExercise(index) {
                    if (confirm('Удалить упражнение?')) {
                        this.activeDayExercises.splice(index, 1);
                    }
                },

                addSet(exIndex) {
                    this.activeDayExercises[exIndex].setsList.push({ reps: 0 });
                },

                removeSet(exIndex, setIndex) {
                    this.activeDayExercises[exIndex].setsList.splice(setIndex, 1);
                    if (this.activeDayExercises[exIndex].setsList.length === 0) {
                        this.removeExercise(exIndex);
                    }
                },

                clearDayData() {
                    delete this.workouts[this.selectedDate];
                    this.saveToStorage();
                    this.openModal = false;
                    if (this.lastActiveHabitBeforeModal === 'all') {
                        this.activeHabitId = 'all';
                        localStorage.setItem('gym_active_habit_v3', 'all');
                        this.lastActiveHabitBeforeModal = null;
                    }
                },

                saveDayData() {
                    this.activeDayExercises = this.activeDayExercises.filter(ex => ex.setsList && ex.setsList.length > 0);
                    if (this.activeDayExercises.length > 0) {
                        this.workouts[this.selectedDate] = JSON.parse(JSON.stringify(this.activeDayExercises));
                    } else {
                        delete this.workouts[this.selectedDate];
                    }
                    this.saveToStorage();
                    this.openModal = false;
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.workouts, null, 2));
                    constdlAnchorElem = document.createElement('a');
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `gym_backup.json`);
                    dlAnchorElem.click();
                },

                importData(event) {
                    const fileReader = new FileReader();
                    if (event.target.files[0]) {
                        fileReader.readAsText(event.target.files[0], "UTF-8");
                        fileReader.onload = (e) => {
                            try {
                                this.workouts = JSON.parse(e.target.result);
                                this.saveToStorage();
                                alert('Успешно!');
                                this.openSettings = false;
                            } catch (err) { alert('Ошибка файла'); }
                        };
                    }
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер</title>
    <!-- Favicon (SVG data URI - works everywhere including GitHub Pages) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'%3E%3Cpath d='M6.5 5A1.5 1.5 0 0 0 5 6.5V8H3.5A1.5 1.5 0 0 0 2 9.5v5A1.5 1.5 0 0 0 3.5 16H5v1.5A1.5 1.5 0 0 0 6.5 19h1A1.5 1.5 0 0 0 9 17.5V16h6v1.5a1.5 1.5 0 0 0 1.5 1.5h1a1.5 1.5 0 0 0 1.5-1.5V16h1.5a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 20.5 8H19V6.5A1.5 1.5 0 0 0 17.5 5h-1A1.5 1.5 0 0 0 15 6.5V8H9V6.5A1.5 1.5 0 0 0 7.5 5h-1z'/%3E%3C/svg%3E">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            0: '#161b22',
                            1: '#0e4429',
                            2: '#006d32',
                            3: '#26a641',
                            4: '#39d353'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; background-color: #0d1117; color: #c9d1d9; }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .modal-enter { animation: modalIn 0.15s ease-out forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .number-pop { animation: popNum 0.1s ease-out; }
        @keyframes popNum {
            0% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        /* Принудительное расширение полей ввода */
        textarea { overflow: hidden; min-height: 24px; display: block; width: 100%; resize: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.8); }
        /* Плавная анимация сворачивания / разворачивания карточек плана */
        .accordion-grid {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.25s ease-in-out, opacity 0.2s ease-in-out;
            opacity: 0;
        }
        .accordion-grid.expanded {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .accordion-inner {
            overflow: hidden;
            min-height: 0;
        }
    </style>
</head>
<script>
    // Автоматическое расширение textarea
    function autoResize(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.max(24, el.scrollHeight + 2) + 'px';
    }
</script>
<body class="min-h-screen font-sans antialiased pb-24" x-data="trackerApp()" x-init="initApp(); $nextTick(() => document.querySelectorAll('textarea').forEach(autoResize))">

    <!-- Minimal Header -->
    <header class="sticky top-0 z-30 px-4 py-3 max-w-md mx-auto flex items-center justify-between bg-[#0d1117]">
        <div class="flex space-x-1 items-center">
            <button @click="setViewMode('week')" :class="viewMode === 'week' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Week</button>
            <button @click="setViewMode('month')" :class="viewMode === 'month' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Month</button>
            <button @click="setViewMode('year')" :class="viewMode === 'year' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Year</button>
            
            <!-- Habit Selector Dropdown -->
            <div class="relative ml-1" x-data="{ openHabitMenu: false }">
                <button @click="openHabitMenu = !openHabitMenu" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#21262d] text-white hover:bg-[#30363d] transition flex items-center space-x-1.5 border border-[#30363d]">
                    <span x-text="activeHabitName"></span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
                </button>

                <!-- iOS-style Popover Menu -->
                <div x-show="openHabitMenu" @click.away="openHabitMenu = false" class="absolute left-0 mt-2 w-48 bg-[#161b22] border border-[#30363d] rounded-2xl shadow-2xl p-1.5 z-50 space-y-1 modal-enter" x-cloak>
                    <template x-for="h in habits" :key="h.id">
                        <div @click="selectHabit(h.id); openHabitMenu = false" 
                             class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition"
                             :class="activeHabitId === h.id ? 'bg-[#21262d] text-white font-bold' : 'text-zinc-400 hover:text-white hover:bg-[#21262d]/50'">
                            <span x-text="h.name"></span>
                            <span x-show="activeHabitId === h.id" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        </div>
                    </template>
                    <div class="border-t border-[#30363d] my-1"></div>
                    <div @click="selectHabit('all'); openHabitMenu = false" 
                         class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition"
                         :class="activeHabitId === 'all' ? 'bg-[#21262d] text-white font-bold' : 'text-zinc-400 hover:text-white hover:bg-[#21262d]/50'">
                        <span>All</span>
                        <span x-show="activeHabitId === 'all'" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    </div>
                    <div class="border-t border-[#30363d] my-1"></div>
                    <button @click="openHabitManager = true; openHabitMenu = false" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-emerald-400 hover:bg-[#21262d] transition flex items-center space-x-2">
                        <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                        <span>Управление делами...</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Cloud sync status indicator -->
            <span class="w-2.5 h-2.5 rounded-full" :class="syncStatusClass" :title="syncStatusText"></span>
            <button @click="openSettings = true" class="p-2 text-zinc-400 hover:text-white transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-4">

        <!-- Date Navigation Bar -->
        <div class="flex items-center justify-between px-2 py-1">
            <button @click="shiftDate(-1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="text-sm font-semibold text-white" x-text="dateRangeTitle"></span>
            <button @click="shiftDate(1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- UNIFORM HEATMAP CONTAINER (Exact same 12-column or uniform square size across all views) -->
        <div class="px-2 space-y-6" id="heatmap-container">
            
            <!-- IF SINGLE HABIT -->
            <template x-if="activeHabitId !== 'all'">
                <div class="space-y-3">
                    <!-- WEEK VIEW -->
                    <template x-if="viewMode === 'week'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="day in currentWeekDays" :key="day.dateStr">
                                <div @click="selectDay(day.dateStr)" 
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(day.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="day.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- MONTH VIEW -->
                    <template x-if="viewMode === 'month'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="cell in currentMonthGrid" :key="cell.dateStr || Math.random()">
                                <div @click="selectDay(cell.dateStr)"
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(cell.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="cell.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- YEAR VIEW -->
                    <template x-if="viewMode === 'year'">
                        <div class="grid grid-cols-12 gap-1.5">
                            <template x-for="day in yearDaysList" :key="day.dateStr">
                                <div @click="selectDay(day.dateStr)"
                                     class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                     :id="isToday(day.dateStr) ? 'today-square' : ''"
                                     :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                     :title="day.dateStr">
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- IF ALL HABITS (SUMMARY VIEW) -->
            <template x-if="activeHabitId === 'all'">
                <div class="space-y-6">
                    <template x-for="h in habits" :key="h.id">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between px-1">
                                <span class="text-xs font-bold text-white" x-text="h.name"></span>
                            </div>
                            
                            <!-- WEEK VIEW FOR HABIT -->
                            <template x-if="viewMode === 'week'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="day in getHabitWeekDays(h.id)" :key="day.dateStr">
                                        <div @click="selectDayForHabit(h.id, day.dateStr)" 
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + day.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- MONTH VIEW FOR HABIT -->
                            <template x-if="viewMode === 'month'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="cell in getHabitMonthGrid(h.id)" :key="cell.dateStr || Math.random()">
                                        <div @click="selectDayForHabit(h.id, cell.dateStr)"
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + cell.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- YEAR VIEW FOR HABIT -->
                            <template x-if="viewMode === 'year'">
                                <div class="grid grid-cols-12 gap-1.5">
                                    <template x-for="day in getHabitYearDays(h.id)" :key="day.dateStr">
                                        <div @click="selectDayForHabit(h.id, day.dateStr)"
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="h.name + ': ' + day.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

        </div>

    </main>

    <!-- DAY DETAIL MODAL -->
    <div x-show="openModal" 
         x-transition:enter="transition-opacity duration-200 ease-out"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity duration-150 ease-in"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click.self="saveAndCloseModal()" 
         class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/70 backdrop-blur-sm" 
         x-cloak>
        <div x-show="openModal"
             x-transition:enter="transition-all duration-200 ease-out"
             x-transition:enter-start="opacity-0 scale-95 translate-y-3"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition-all duration-150 ease-in"
             x-transition:leave-start="opacity-100 scale-100 translate-y-0"
             x-transition:leave-end="opacity-0 scale-95 translate-y-3"
             class="bg-[#161b22] w-full max-w-sm rounded-[38px] p-4 sm:p-5 space-y-4 shadow-2xl overflow-hidden max-h-[85vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
                <h3 class="font-bold text-white text-base" x-text="formatDateHuman(selectedDate)"></h3>
                
                <div class="flex items-center space-x-1.5">
                    <!-- Three dots menu -->
                    <div class="relative" x-data="{ openMenu: false }">
                        <button @click="openMenu = !openMenu" class="p-1.5 rounded-xl bg-[#21262d] text-zinc-300 hover:text-white transition">
                            <i data-lucide="more-vertical" class="w-5 h-5"></i>
                        </button>
                        <div x-show="openMenu" @click.away="openMenu = false" class="absolute right-0 mt-2 w-36 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl p-1 z-50 modal-enter" x-cloak>
                            <button @click="clearDayData(); openMenu = false" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-red-400 hover:bg-[#21262d] transition">
                                Очистить день
                            </button>
                        </div>
                    </div>

                    <!-- Close button -->
                    <button @click="saveAndCloseModal()" class="p-1.5 rounded-xl bg-[#21262d] text-zinc-400 hover:text-white transition" title="Закрыть">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Exercises List -->
            <div class="space-y-4 overflow-y-auto pr-1 flex-1 py-1">

                <!-- Planned tasks for this date if any -->
                <template x-if="plannedTasksForSelectedDate.length > 0">
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2 px-1 text-xs font-semibold text-zinc-400">
                            <i data-lucide="calendar" class="w-4 h-4 text-zinc-400"></i>
                            <span>Запланировано на этот день:</span>
                        </div>

                        <template x-for="(plan, pIdx) in plannedTasksForSelectedDate" :key="'plan'+pIdx">
                            <div x-data="{ isExpanded: false }" class="bg-[#0d1117] rounded-[26px] overflow-hidden transition-all shadow-lg">
                                
                                <!-- Card Collapsible Header -->
                                <div @click="isExpanded = !isExpanded; $nextTick(() => { lucide.createIcons(); document.querySelectorAll('textarea').forEach(autoResize); })" 
                                     class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-white/5 transition select-none">
                                    <div class="flex items-center space-x-2.5 min-w-0 flex-1 mr-2">
                                        <!-- Круговой индикатор прогресса -->
                                        <div @click.stop="toggleTask(plan.task); saveToStorage()" class="relative flex items-center justify-center w-6 h-6 flex-shrink-0 cursor-pointer" title="Переключить статус">
                                            <svg class="w-6 h-6 -rotate-90" viewBox="0 0 36 36">
                                                <circle cx="18" cy="18" r="15.915" fill="none" stroke="#21262d" stroke-width="4"></circle>
                                                <circle cx="18" cy="18" r="15.915" fill="none" stroke="#10b981" stroke-width="4" 
                                                        :stroke-dasharray="getTaskProgress(plan.task) + ', 100'" stroke-dashoffset="0" 
                                                        class="transition-all duration-300"></circle>
                                            </svg>
                                            <i data-lucide="check" class="absolute w-3 h-3 text-emerald-400" x-show="getTaskProgress(plan.task) === 100"></i>
                                        </div>
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center space-x-1.5">
                                                <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded-lg bg-[#21262d] text-zinc-300 uppercase tracking-wider">План</span>
                                                <span class="text-[10px] text-zinc-500 truncate" x-text="'из ' + formatDateHuman(plan.sourceDate)"></span>
                                            </div>
                                            <div class="text-xs font-semibold text-white truncate mt-0.5" :class="getTaskProgress(plan.task) === 100 ? 'line-through text-zinc-500' : ''" x-text="plan.task.name || 'Без названия'"></div>
                                        </div>
                                    </div>

                                    <div class="flex items-center space-x-2 flex-shrink-0">
                                        <span class="text-xs font-mono font-bold text-zinc-400" x-text="getTaskProgress(plan.task) + '%'"></span>
                                        <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 transition-transform duration-200" :class="isExpanded ? 'rotate-180' : ''"></i>
                                    </div>
                                </div>

                                <!-- Card Body (Expanded with smooth accordion animation) -->
                                <div class="accordion-grid" :class="isExpanded ? 'expanded' : ''">
                                    <div class="accordion-inner">
                                        <div class="p-3.5 pt-0 space-y-3 mt-1">
                                    
                                    <!-- 1. Название главной задачи и число -->
                                    <div class="flex items-start justify-between gap-2 pt-2">
                                        <div class="flex items-start space-x-2 flex-1 min-w-0">
                                            <textarea x-effect="autoResize($el)" x-model="plan.task.name" @input="autoResize($event.target)" @change="saveToStorage()" @click.stop rows="1" placeholder="Название задачи..." class="bg-[#161b22] text-sm font-semibold text-white rounded-2xl px-3.5 py-2 focus:outline-none focus:ring-1 focus:ring-zinc-600 w-full resize-none leading-relaxed" :class="getTaskProgress(plan.task) === 100 ? 'line-through text-zinc-500' : ''"></textarea>
                                            <div @click.stop="openTaskPicker(plan.task)" class="cursor-pointer text-sm font-bold text-white hover:text-zinc-300 transition select-none px-2.5 py-2 flex-shrink-0 bg-[#161b22] rounded-2xl" title="Нажми для изменения">
                                                <span x-text="plan.task.reps"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 2. Шаги главной задачи -->
                                    <div class="space-y-1.5 pl-1">
                                        <div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Шаги задачи</div>
                                        <template x-for="(subTask, subIndex) in plan.task.subTasks" :key="'pst'+subIndex">
                                            <div class="flex items-start justify-between bg-[#161b22] px-3 py-2 rounded-2xl gap-2">
                                                <div class="flex items-start space-x-2 flex-1 min-w-0">
                                                    <button @click.stop="toggleTask(subTask); saveToStorage()" class="flex items-center justify-center w-4 h-4 rounded-full border-2 border-[#30363d] transition flex-shrink-0 mt-0.5" :class="subTask.completed ? 'bg-emerald-500 border-emerald-500' : 'bg-[#0d1117]'">
                                                        <i data-lucide="check" class="w-2.5 h-2.5 text-white" x-show="subTask.completed"></i>
                                                    </button>
                                                    <textarea x-effect="autoResize($el)" x-model="subTask.name" @input="autoResize($event.target)" @change="saveToStorage()" @click.stop rows="1" placeholder="Шаг задачи..." class="bg-transparent text-xs text-zinc-300 focus:outline-none w-full resize-none leading-relaxed py-0.5" :class="subTask.completed ? 'line-through text-zinc-500' : ''"></textarea>
                                                    <div @click.stop="openTaskPicker(subTask)" class="cursor-pointer text-xs font-bold text-white hover:text-zinc-300 transition select-none px-1 flex-shrink-0 mt-0.5" title="Изменить">
                                                        <span x-text="subTask.reps"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- Кнопка добавления шага (прижата вправо) -->
                                        <div class="flex justify-end pt-0.5">
                                            <button @click.stop="addSubTask(plan.task, $event)" class="text-xs text-zinc-400 hover:text-white flex items-center space-x-1 py-1 px-2 rounded-xl hover:bg-[#161b22] transition">
                                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                                <span>Добавить шаг</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 3. Замер (всегда доступен) -->
                                    <div class="pt-2 space-y-1.5">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Замер</span>
                                            <div class="flex items-center space-x-1.5 bg-[#161b22] rounded-xl px-2.5 py-1">
                                                <i data-lucide="calendar" class="w-3 h-3 text-zinc-400"></i>
                                                <input type="date" x-model="plan.task.measurementBlock.date" @change="saveToStorage()" @click.stop class="bg-transparent text-[11px] text-white focus:outline-none cursor-pointer">
                                            </div>
                                        </div>
                                        <textarea x-effect="autoResize($el)" x-model="plan.task.measurementBlock.description" @input="autoResize($event.target)" @change="saveToStorage()" @click.stop rows="1" placeholder="Показатели замера..." class="bg-[#161b22] text-xs text-zinc-200 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-zinc-600 w-full resize-none leading-relaxed"></textarea>
                                    </div>

                                    <!-- 4. Решение (всегда отображается) -->
                                    <div class="pt-2 space-y-2">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Решение</span>
                                            <div class="flex items-center space-x-1.5 bg-[#161b22] rounded-xl px-2.5 py-1">
                                                <i data-lucide="calendar" class="w-3 h-3 text-zinc-400"></i>
                                                <input type="date" x-model="plan.task.solutionBlock.date" @change="saveToStorage()" @click.stop class="bg-transparent text-[11px] text-white focus:outline-none cursor-pointer">
                                            </div>
                                        </div>

                                        <!-- Заголовок решения как мини-задача -->
                                        <div class="flex items-start space-x-2 w-full pl-1">
                                            <div class="relative flex items-center justify-center w-5 h-5 flex-shrink-0 mt-0.5">
                                                <svg class="w-5 h-5 -rotate-90" viewBox="0 0 36 36">
                                                    <circle cx="18" cy="18" r="15.915" fill="none" stroke="#21262d" stroke-width="4"></circle>
                                                    <circle cx="18" cy="18" r="15.915" fill="none" stroke="#10b981" stroke-width="4" 
                                                            :stroke-dasharray="getTaskProgress(plan.task) + ', 100'" stroke-dashoffset="0"

                                                    </div>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                                    <div class="flex items-start justify-between gap-2">

                                                            :stroke-dasharray="getTaskProgress(task) + ', 100'" stroke-dashoffset="0"

                                                </svg>
                                                <i data-lucide="check" class="absolute w-3 h-3 text-emerald-400" x-show="getTaskProgress(task) === 100"></i>
                                            </div>
                                            <!-- Поле ввода главной задачи -->
                                            <textarea x-effect="autoResize($el)" x-model="task.name" @input="autoResize($event.target)" @click.stop rows="1" placeholder="Название задачи..." class="bg-transparent text-sm font-semibold text-white focus:outline-none w-full resize-none leading-relaxed py-0.5" :class="getTaskProgress(task) === 100 ? 'line-through text-zinc-500' : ''"></textarea>

                                                <span>Добавить шаг</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 3. Замер (под шагами) -->
                                    <div class="pt-2 space-y-2">

                                        <textarea x-effect="autoResize($el)" x-model="task.measurementBlock.description" @input="autoResize($event.target)" @click.stop rows="1" placeholder="Показатели замера..." class="bg-[#161b22] text-xs text-zinc-200 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-zinc-600 w-full resize-none leading-relaxed"></textarea>

                                                        </div>

                                                        </button>
                                                        <div x-show="openSolMenu" @click.away="openSolMenu = false" class="absolute right-0 mt-2 w-32 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl p-1 z-50 modal-enter" x-cloak>
                                                            <button @click.stop="task.solutionBlock.steps.splice(solIndex, 1); openSolMenu = false; saveDayData()" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-red-400 hover:bg-[#21262d] transition">
                                                                Удалить
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>

                                            <div class="flex justify-end pt-0.5">

                                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                                    <span>Добавить шаг решения</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                </button>
                                <button @click="addSet(exIndex)" class="flex-1 py-2.5 bg-[#161b22] hover:bg-[#21262d] rounded-2xl text-zinc-300 flex items-center justify-center transition active:scale-95">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            </div>

                    </div>
                </template>

                <div class="flex space-x-2 pt-1">

                    <div class="relative flex-1" x-data="{ openTemplates: false }">
                        <button @click="openTemplates = !openTemplates; $nextTick(() => lucide.createIcons())" class="w-full py-3 bg-[#161b22] hover:bg-[#21262d] rounded-2xl text-xs font-semibold text-zinc-300 flex items-center justify-center space-x-2 transition active:scale-95">

                            <span>Шаблоны</span>

                    <button @click="addExerciseRow()" class="w-12 py-3 bg-[#161b22] hover:bg-[#21262d] rounded-2xl text-white flex items-center justify-center transition active:scale-95" title="Новое упражнение">
                        <i data-lucide="plus" class="w-5 h-5 text-zinc-300"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- FULLSCREEN BLUR DRAG REPS PICKER OVERLAY -->
    <div x-show="openPickerModal" 
         @touchstart="startPickerDrag($event)" 
         @mousedown="startPickerDrag($event)"
         class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md select-none cursor-ns-resize" 
         x-cloak>
        
        <!-- Big white number with pop animation -->
        <div class="text-center">
            <div class="text-8xl font-black text-white transition-transform duration-75" :class="animatingPop ? 'number-pop' : ''" x-text="pickerCurrentVal"></div>
        </div>

        <div class="absolute bottom-8 right-8 z-[70]">
            <button @click.stop.prevent="closePicker()" class="w-16 h-16 bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-zinc-400 hover:text-white rounded-full flex items-center justify-center shadow-2xl transition active:scale-90">
                <i data-lucide="check" class="w-8 h-8 stroke-[3]"></i>
            </button>
        </div>
    </div>

    <!-- SETTINGS & CLOUD SYNC MODAL -->
    <div x-show="openSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>

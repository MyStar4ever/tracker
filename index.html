<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            0: '#161b22',
                            1: '#0e4429',
                            2: '#006d32',
                            3: '#26a641',
                            4: '#39d353'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Hide scrollbars for clean iOS feel */
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
    </style>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white pb-24" x-data="trackerApp()">

    <!-- Minimal Header -->
    <header class="bg-[#0d1117] sticky top-0 z-30 px-4 py-4 max-w-md mx-auto flex items-center justify-between">
        <div class="flex bg-[#161b22] p-1 rounded-xl">
            <button @click="viewMode = 'week'" :class="viewMode === 'week' ? 'bg-[#30363d] text-white' : 'text-zinc-400'" class="px-3 py-1 rounded-lg text-xs font-medium transition">Неделя</button>
            <button @click="viewMode = 'month'" :class="viewMode === 'month' ? 'bg-[#30363d] text-white' : 'text-zinc-400'" class="px-3 py-1 rounded-lg text-xs font-medium transition">Месяц</button>
            <button @click="viewMode = 'year'" :class="viewMode === 'year' ? 'bg-[#30363d] text-white' : 'text-zinc-400'" class="px-3 py-1 rounded-lg text-xs font-medium transition">Год</button>
        </div>
        
        <div class="flex items-center space-x-2">
            <button @click="openSettings = true" class="p-2 rounded-xl bg-[#161b22] text-zinc-400 hover:text-white transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-4">

        <!-- Date Navigation Bar -->
        <div class="flex items-center justify-between bg-[#161b22] px-4 py-2.5 rounded-2xl">
            <button @click="shiftDate(-1)" class="text-zinc-400 hover:text-white p-1">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="text-sm font-semibold text-white" x-text="dateRangeTitle"></span>
            <button @click="shiftDate(1)" class="text-zinc-400 hover:text-white p-1">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- HEATMAP CONTAINER (Clean, no borders, fits screen) -->
        <div class="bg-[#161b22] p-4 rounded-2xl space-y-3">
            
            <!-- WEEK VIEW -->
            <template x-if="viewMode === 'week'">
                <div class="grid grid-cols-7 gap-2">
                    <template x-for="day in currentWeekDays" :key="day.dateStr">
                        <div @click="selectDay(day.dateStr)" 
                             class="flex flex-col items-center justify-between p-2.5 rounded-xl cursor-pointer transition active:scale-95"
                             :class="isToday(day.dateStr) ? 'bg-[#30363d]' : 'bg-[#0d1117]'">
                            <span class="text-[10px] text-zinc-500 uppercase" x-text="day.dayName"></span>
                            <span class="text-sm font-bold text-white my-1.5" x-text="day.dayNum"></span>
                            <div class="w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold"
                                 :class="getColorClass(day.intensity)">
                                <span x-text="day.totalReps > 0 ? day.totalReps : ''"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- MONTH VIEW (All days visible, no borders) -->
            <template x-if="viewMode === 'month'">
                <div>
                    <div class="grid grid-cols-7 gap-1 mb-2 text-center text-[10px] text-zinc-500 font-medium">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div class="grid grid-cols-7 gap-1.5">
                        <template x-for="cell in currentMonthGrid" :key="cell.dateStr || Math.random()">
                            <template x-if="cell.empty">
                                <div class="aspect-square bg-transparent"></div>
                            </template>
                            <template x-if="!cell.empty">
                                <div @click="selectDay(cell.dateStr)"
                                     class="aspect-square rounded-lg p-1 flex flex-col justify-between items-center cursor-pointer transition active:scale-95 relative"
                                     :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-emerald-400' : '']">
                                    <span class="text-[10px] font-medium" :class="isToday(cell.dateStr) ? 'text-emerald-400 font-bold' : 'text-zinc-400'" x-text="cell.dayNum"></span>
                                    <div class="w-1.5 h-1.5 rounded-full" :class="cell.intensity > 0 ? 'bg-white/90' : 'bg-transparent'"></div>
                                </div>
                            </template>
                        </template>
                    </div>
                </div>
            </template>

            <!-- YEAR VIEW (Compact grid for phone) -->
            <template x-if="viewMode === 'year'">
                <div class="grid grid-cols-12 gap-1.5">
                    <template x-for="day in yearDaysList" :key="day.dateStr">
                        <div @click="selectDay(day.dateStr)"
                             class="aspect-square rounded-[4px] cursor-pointer transition active:scale-90 relative"
                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                             :title="day.dateStr">
                        </div>
                    </template>
                </div>
            </template>

        </div>

    </main>

    <!-- FLOATING ACTION BUTTON (FAB) in bottom right corner -->
    <div class="fixed bottom-6 right-6 z-40">
        <button @click="selectDay(todayStr)" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-black rounded-full flex items-center justify-center shadow-xl shadow-emerald-950/60 transition active:scale-90">
            <i data-lucide="plus" class="w-8 h-8 stroke-[2.5]"></i>
        </button>
    </div>

    <!-- DAY DETAIL MODAL (iOS Timer / Stepper style) -->
    <div x-show="openModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openModal = false" class="bg-[#161b22] w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 shadow-2xl overflow-hidden max-h-[85vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
                <h3 class="font-bold text-white text-base" x-text="formatDateHuman(selectedDate)"></h3>
                <button @click="openModal = false" class="p-1 rounded-full bg-[#30363d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Exercises List -->
            <div class="space-y-4 overflow-y-auto pr-1 flex-1 py-1">
                <template x-for="(ex, exIndex) in activeDayExercises" :key="exIndex">
                    <div class="bg-[#0d1117] p-3.5 rounded-2xl space-y-3">
                        
                        <!-- Exercise Header / Select -->
                        <div class="flex items-center justify-between">
                            <select x-model="ex.name" class="bg-[#161b22] text-white text-sm font-semibold rounded-xl px-3 py-1.5 focus:outline-none w-2/3">
                                <option value="Отжимания">Отжимания</option>
                                <option value="Подтягивания">Подтягивания</option>
                                <option value="Приседания">Приседания</option>
                                <option value="Пресс">Пресс</option>
                                <option value="Планка (сек)">Планка (сек)</option>
                                <option value="Брусья">Брусья</option>
                                <option value="Другое">Другое</option>
                            </select>
                            <button @click="removeExercise(exIndex)" class="text-zinc-500 hover:text-red-400 p-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Sets & Reps iOS Wheel / Stepper Style -->
                        <div class="space-y-2 pt-1">
                            <template x-for="(set, setIndex) in ex.setsList" :key="setIndex">
                                <div class="flex items-center justify-between bg-[#161b22] px-3 py-2 rounded-xl">
                                    <span class="text-xs text-zinc-400 font-medium">Подход <span x-text="setIndex + 1"></span></span>
                                    
                                    <div class="flex items-center space-x-3">
                                        <!-- Reps Stepper (iPhone timer style buttons) -->
                                        <div class="flex items-center space-x-2 bg-[#0d1117] px-2 py-1 rounded-lg">
                                            <button @click="adjustReps(exIndex, setIndex, -1)" class="w-7 h-7 bg-[#21262d] hover:bg-[#30363d] text-white rounded-md flex items-center justify-center font-bold text-sm transition active:scale-95">-</button>
                                            <span class="w-8 text-center text-sm font-bold text-emerald-400" x-text="set.reps"></span>
                                            <button @click="adjustReps(exIndex, setIndex, 1)" class="w-7 h-7 bg-[#21262d] hover:bg-[#30363d] text-white rounded-md flex items-center justify-center font-bold text-sm transition active:scale-95">+</button>
                                        </div>

                                        <!-- Delete set -->
                                        <button @click="removeSet(exIndex, setIndex)" class="text-zinc-600 hover:text-red-400 p-1">
                                            <i data-lucide="minus-circle" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Add Set Quick Button (+) -->
                            <button @click="addSet(exIndex)" class="w-full py-2 bg-emerald-950/30 hover:bg-emerald-900/30 border border-emerald-500/20 rounded-xl text-xs font-semibold text-emerald-400 flex items-center justify-center space-x-1 transition active:scale-95">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                <span>Добавить подход</span>
                            </button>
                        </div>

                    </div>
                </template>

                <!-- Add Exercise Button -->
                <button @click="addExerciseRow()" class="w-full py-3 bg-[#161b22] hover:bg-[#21262d] rounded-2xl text-xs font-semibold text-white flex items-center justify-center space-x-2 transition active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4 text-emerald-400"></i>
                    <span>Новое упражнение</span>
                </button>
            </div>

            <!-- Modal Footer -->
            <div class="pt-2 flex space-x-2">
                <button @click="clearDayData()" class="px-4 py-2.5 rounded-xl bg-red-500/10 text-red-400 text-xs font-semibold hover:bg-red-500/20 transition">
                    Очистить
                </button>
                <button @click="saveDayData()" class="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-bold transition shadow-lg shadow-emerald-950">
                    Сохранить
                </button>
            </div>

        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div x-show="openSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openSettings = false" class="bg-[#161b22] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-[#30363d] pb-3">
                <h3 class="font-bold text-white text-base">Настройки</h3>
                <button @click="openSettings = false" class="p-1 rounded-full bg-[#30363d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs text-zinc-300">
                <p class="text-zinc-400">Резервное копирование данных (сохранение в файл и восстановление).</p>
                <div class="flex space-x-2 pt-1">
                    <button @click="exportData()" class="flex-1 py-2.5 rounded-xl bg-[#0d1117] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Экспорт</span>
                    </button>
                    <label class="flex-1 py-2.5 rounded-xl bg-[#0d1117] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span>Импорт</span>
                        <input type="file" @change="importData" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <div class="border-t border-[#30363d] pt-3 flex justify-end">
                <button @click="openSettings = false" class="px-4 py-2 rounded-xl bg-emerald-500 text-black text-xs font-bold">
                    Готово
                </button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        function trackerApp() {
            return {
                workouts: {}, // format: { 'YYYY-MM-DD': [{name: 'Отжимания', setsList: [{reps: 20}, {reps: 25}] }] }
                viewMode: 'month', // 'week', 'month', 'year'
                currentDate: new Date(),
                todayStr: '',
                openModal: false,
                openSettings: false,
                selectedDate: '',
                activeDayExercises: [],

                init() {
                    const saved = localStorage.getItem('gym_streak_data_v2');
                    if (saved) {
                        try {
                            this.workouts = JSON.parse(saved);
                        } catch (e) {
                            console.error(e);
                        }
                    } else {
                        // Migrate or default demo
                        const oldSaved = localStorage.getItem('gym_streak_data');
                        if (oldSaved) {
                            try {
                                const oldData = JSON.parse(oldSaved);
                                // Convert old format to new setsList format
                                for (let date in oldData) {
                                    this.workouts[date] = oldData[date].map(ex => ({
                                        name: ex.name,
                                        setsList: Array.from({length: ex.sets || 3}, () => ({ reps: Math.round((ex.reps || 20) / (ex.sets || 3)) }))
                                    }));
                                }
                                this.saveToStorage();
                            } catch(err) {}
                        } else {
                            this.loadDemoData();
                        }
                    }

                    const today = new Date();
                    this.todayStr = this.formatDateIso(today);
                    this.selectedDate = this.todayStr;

                    this.$nextTick(() => lucide.createIcons());
                    this.$watch('viewMode', () => this.$nextTick(() => lucide.createIcons()));
                    this.$watch('openModal', () => this.$nextTick(() => lucide.createIcons()));
                },

                loadDemoData() {
                    const today = new Date();
                    const dStr = this.formatDateIso(today);
                    this.workouts[dStr] = [
                        { name: 'Отжимания', setsList: [{reps: 25}, {reps: 20}, {reps: 15}] },
                        { name: 'Пресс', setsList: [{reps: 30}, {reps: 30}] }
                    ];
                    this.saveToStorage();
                },

                saveToStorage() {
                    localStorage.setItem('gym_streak_data_v2', JSON.stringify(this.workouts));
                },

                formatDateIso(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },

                formatDateHuman(dateStr) {
                    if (!dateStr) return '';
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const date = new Date(y, m - 1, d);
                    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
                },

                isToday(dateStr) {
                    return dateStr === this.todayStr;
                },

                getIntensity(dateStr) {
                    const dayExs = this.workouts[dateStr];
                    if (!dayExs || !dayExs.length) return 0;
                    
                    let totalReps = 0;
                    dayExs.forEach(ex => {
                        if (ex.setsList) {
                            ex.setsList.forEach(s => totalReps += Number(s.reps || 0));
                        }
                    });

                    if (totalReps === 0) return 0;
                    if (totalReps < 30) return 1;
                    if (totalReps < 70) return 2;
                    if (totalReps < 150) return 3;
                    return 4;
                },

                getColorClass(intensity) {
                    switch (intensity) {
                        case 1: return 'bg-github-1';
                        case 2: return 'bg-github-2';
                        case 3: return 'bg-github-3';
                        case 4: return 'bg-github-4';
                        default: return 'bg-github-0';
                    }
                },

                get dateRangeTitle() {
                    const y = this.currentDate.getFullYear();
                    const m = this.currentDate.getMonth();
                    if (this.viewMode === 'week') return `Неделя (${y})`;
                    if (this.viewMode === 'month') {
                        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
                        return `${months[m]} ${y}`;
                    }
                    return `${y} год`;
                },

                shiftDate(direction) {
                    const d = new Date(this.currentDate);
                    if (this.viewMode === 'week') d.setDate(d.getDate() + (direction * 7));
                    else if (this.viewMode === 'month') d.setMonth(d.getMonth() + direction);
                    else d.setFullYear(d.getFullYear() + direction);
                    this.currentDate = d;
                },

                get currentWeekDays() {
                    let d = new Date(this.currentDate);
                    let dayOfWeek = d.getDay();
                    let distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    d.setDate(d.getDate() + distanceToMonday);

                    let days = [];
                    const names = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
                    for (let i = 0; i < 7; i++) {
                        let dateStr = this.formatDateIso(d);
                        let totalR = 0;
                        if (this.workouts[dateStr]) {
                            this.workouts[dateStr].forEach(ex => ex.setsList?.forEach(s => totalR += Number(s.reps || 0)));
                        }
                        days.push({
                            dateStr: dateStr,
                            dayName: names[i],
                            dayNum: d.getDate(),
                            intensity: this.getIntensity(dateStr),
                            totalReps: totalR
                        });
                        d.setDate(d.getDate() + 1);
                    }
                    return days;
                },

                get currentMonthGrid() {
                    let y = this.currentDate.getFullYear();
                    let m = this.currentDate.getMonth();
                    let firstDayOfMonth = new Date(y, m, 1);
                    let lastDayOfMonth = new Date(y, m + 1, 0);
                    let startingDayOfWeek = firstDayOfMonth.getDay();
                    let startIndex = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;
                    
                    let grid = [];
                    for (let i = 0; i < startIndex; i++) grid.push({ empty: true });

                    for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                        let dateObj = new Date(y, m, i);
                        let dateStr = this.formatDateIso(dateObj);
                        grid.push({
                            empty: false,
                            dateStr: dateStr,
                            dayNum: i,
                            intensity: this.getIntensity(dateStr)
                        });
                    }
                    return grid;
                },

                get yearDaysList() {
                    let y = this.currentDate.getFullYear();
                    let startDate = new Date(y, 0, 1);
                    let endDate = new Date(y, 11, 31);
                    let list = [];
                    let curr = new Date(startDate);
                    while (curr <= endDate) {
                        let dateStr = this.formatDateIso(curr);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensity(dateStr)
                        });
                        curr.setDate(curr.getDate() + 1);
                    }
                    return list;
                },

                selectDay(dateStr) {
                    if (!dateStr) return;
                    this.selectedDate = dateStr;
                    const existing = this.workouts[dateStr];
                    if (existing && existing.length > 0) {
                        this.activeDayExercises = JSON.parse(JSON.stringify(existing));
                    } else {
                        this.activeDayExercises = [
                            { name: 'Отжимания', setsList: [{reps: 20}] }
                        ];
                    }
                    this.openModal = true;
                },

                addExerciseRow() {
                    this.activeDayExercises.push({ name: 'Приседания', setsList: [{reps: 20}] });
                },

                removeExercise(index) {
                    this.activeDayExercises.splice(index, 1);
                },

                addSet(exIndex) {
                    const lastRep = this.activeDayExercises[exIndex].setsList.slice(-1)[0]?.reps || 20;
                    this.activeDayExercises[exIndex].setsList.push({ reps: lastRep });
                },

                removeSet(exIndex, setIndex) {
                    this.activeDayExercises[exIndex].setsList.splice(setIndex, 1);
                    if (this.activeDayExercises[exIndex].setsList.length === 0) {
                        this.removeExercise(exIndex);
                    }
                },

                adjustReps(exIndex, setIndex, delta) {
                    let current = Number(this.activeDayExercises[exIndex].setsList[setIndex].reps || 0);
                    current += delta;
                    if (current < 1) current = 1;
                    if (current > 999) current = 999;
                    this.activeDayExercises[exIndex].setsList[setIndex].reps = current;
                },

                clearDayData() {
                    delete this.workouts[this.selectedDate];
                    this.saveToStorage();
                    this.openModal = false;
                },

                saveDayData() {
                    // Filter out empty
                    this.activeDayExercises = this.activeDayExercises.filter(ex => ex.setsList && ex.setsList.length > 0);
                    if (this.activeDayExercises.length > 0) {
                        this.workouts[this.selectedDate] = JSON.parse(JSON.stringify(this.activeDayExercises));
                    } else {
                        delete this.workouts[this.selectedDate];
                    }
                    this.saveToStorage();
                    this.openModal = false;
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.workouts, null, 2));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `gym_backup.json`);
                    dlAnchorElem.click();
                },

                importData(event) {
                    const fileReader = new FileReader();
                    if (event.target.files[0]) {
                        fileReader.readAsText(event.target.files[0], "UTF-8");
                        fileReader.onload = (e) => {
                            try {
                                this.workouts = JSON.parse(e.target.result);
                                this.saveToStorage();
                                alert('Успешно!');
                                this.openSettings = false;
                            } catch (err) { alert('Ошибка файла'); }
                        };
                    }
                }
            }
        }
    </script>
</body>
</html>

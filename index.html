<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            0: '#161b22',
                            1: '#0e4429',
                            2: '#006d32',
                            3: '#26a641',
                            4: '#39d353'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; background-color: #0d1117; color: #c9d1d9; }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        /* Smooth modal animations */
        .modal-enter { animation: modalIn 0.2s ease-out forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased pb-24" x-data="trackerApp()">

    <!-- Minimal Header (No background cards / frames) -->
    <header class="sticky top-0 z-30 px-4 py-4 max-w-md mx-auto flex items-center justify-between bg-[#0d1117]">
        <div class="flex space-x-1">
            <button @click="setViewMode('week')" :class="viewMode === 'week' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Неделя</button>
            <button @click="setViewMode('month')" :class="viewMode === 'month' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Месяц</button>
            <button @click="setViewMode('year')" :class="viewMode === 'year' ? 'bg-[#21262d] text-white' : 'text-zinc-500'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">Год</button>
        </div>
        
        <div class="flex items-center space-x-2">
            <button @click="openSettings = true" class="p-2 text-zinc-400 hover:text-white transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-4">

        <!-- Date Navigation Bar (Clean, no frame cards) -->
        <div class="flex items-center justify-between px-2 py-2">
            <button @click="shiftDate(-1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="text-sm font-semibold text-white" x-text="dateRangeTitle"></span>
            <button @click="shiftDate(1)" class="text-zinc-500 hover:text-white p-1 transition">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- HEATMAP CONTAINER (Flat, no frames, pure squares) -->
        <div class="px-2 space-y-3">
            
            <!-- WEEK VIEW -->
            <template x-if="viewMode === 'week'">
                <div class="grid grid-cols-7 gap-2">
                    <template x-for="day in currentWeekDays" :key="day.dateStr">
                        <div @click="selectDay(day.dateStr)" 
                             class="flex flex-col items-center justify-between p-2.5 rounded-lg cursor-pointer transition active:scale-95"
                             :class="isToday(day.dateStr) ? 'bg-[#21262d]' : 'bg-[#161b22]'">
                            <span class="text-[10px] text-zinc-500 uppercase" x-text="day.dayName"></span>
                            <span class="text-sm font-bold text-white my-1.5" x-text="day.dayNum"></span>
                            <div class="w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold text-white"
                                 :class="getColorClass(day.intensity)">
                                <span x-text="day.totalReps > 0 ? day.totalReps : ''"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- MONTH VIEW (Clean grid, no container cards) -->
            <template x-if="viewMode === 'month'">
                <div>
                    <div class="grid grid-cols-7 gap-1 mb-3 text-center text-[10px] text-zinc-500 font-medium">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div class="grid grid-cols-7 gap-2">
                        <template x-for="cell in currentMonthGrid" :key="cell.dateStr || Math.random()">
                            <template x-if="cell.empty">
                                <div class="aspect-square bg-transparent"></div>
                            </template>
                            <template x-if="!cell.empty">
                                <div @click="selectDay(cell.dateStr)"
                                     class="aspect-square rounded-md p-1 flex flex-col justify-between items-center cursor-pointer transition active:scale-95"
                                     :class="[getColorClass(cell.intensity), isToday(cell.dateStr) ? 'ring-1 ring-white' : '']">
                                    <span class="text-[10px] font-medium text-zinc-400" x-text="cell.dayNum"></span>
                                    <div class="w-1.5 h-1.5 rounded-full" :class="cell.intensity > 0 ? 'bg-white/90' : 'bg-transparent'"></div>
                                </div>
                            </template>
                        </template>
                    </div>
                </div>
            </template>

            <!-- YEAR VIEW (GitHub Heatmap clean grid of all days) -->
            <template x-if="viewMode === 'year'">
                <div class="grid grid-cols-7 gap-1.5">
                    <template x-for="day in yearDaysList" :key="day.dateStr">
                        <div @click="selectDay(day.dateStr)"
                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                             :class="[getColorClass(day.intensity), isToday(day.dateStr) ? 'ring-1 ring-white' : '']"
                             :title="day.dateStr">
                        </div>
                    </template>
                </div>
            </template>

        </div>

    </main>

    <!-- FLOATING ACTION BUTTON (FAB) -->
    <div class="fixed bottom-6 right-6 z-40">
        <button @click="selectDay(todayStr)" class="w-14 h-14 bg-[#21262d] hover:bg-[#30363d] text-white rounded-full flex items-center justify-center shadow-2xl transition active:scale-90 border border-[#30363d]">
            <i data-lucide="plus" class="w-7 h-7 stroke-[2.5]"></i>
        </button>
    </div>

    <!-- DAY DETAIL MODAL (Centered with scale animation) -->
    <div x-show="openModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openModal = false" class="bg-[#161b22] border border-[#30363d] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl overflow-hidden max-h-[85vh] flex flex-col modal-enter">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
                <h3 class="font-bold text-white text-base" x-text="formatDateHuman(selectedDate)"></h3>
                <button @click="openModal = false" class="p-1.5 rounded-xl bg-[#21262d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Exercises List -->
            <div class="space-y-4 overflow-y-auto pr-1 flex-1 py-1">
                <template x-for="(ex, exIndex) in activeDayExercises" :key="exIndex">
                    <div class="bg-[#0d1117] border border-[#30363d] p-3.5 rounded-2xl space-y-3">
                        
                        <!-- Exercise Header / Select -->
                        <div class="flex items-center justify-between">
                            <select x-model="ex.name" class="bg-[#161b22] border border-[#30363d] text-white text-sm font-semibold rounded-xl px-3 py-1.5 focus:outline-none w-2/3">
                                <option value="Отжимания">Отжимания</option>
                                <option value="Подтягивания">Подтягивания</option>
                                <option value="Приседания">Приседания</option>
                                <option value="Пресс">Пресс</option>
                                <option value="Другое">Другое</option>
                            </select>
                            <button @click="removeExercise(exIndex)" class="text-zinc-500 hover:text-red-400 p-1.5 rounded-xl bg-[#161b22] border border-[#30363d]">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Sets List with touch drag / swipe vertical rep changer -->
                        <div class="space-y-2 pt-1">
                            <template x-for="(set, setIndex) in ex.setsList" :key="setIndex">
                                <div class="flex items-center justify-between bg-[#161b22] border border-[#30363d] px-3 py-2 rounded-xl">
                                    <span class="text-xs text-zinc-400 font-medium">Подход <span x-text="setIndex + 1"></span></span>
                                    
                                    <div class="flex items-center space-x-3">
                                        <!-- Swipe/Drag Reps Box -->
                                        <div @touchstart="startDrag($event, exIndex, setIndex)"
                                             @mousedown="startDrag($event, exIndex, setIndex)"
                                             class="flex items-center space-x-2 bg-[#0d1117] border border-[#30363d] px-3 py-1 rounded-lg cursor-ns-resize select-none"
                                             title="Тяни вверх/вниз">
                                            <button @click.stop="adjustReps(exIndex, setIndex, -1)" class="text-zinc-400 hover:text-white px-1 text-sm font-bold">-</button>
                                            <span class="w-8 text-center text-sm font-bold text-white" x-text="set.reps"></span>
                                            <button @click.stop="adjustReps(exIndex, setIndex, 1)" class="text-zinc-400 hover:text-white px-1 text-sm font-bold">+</button>
                                        </div>

                                        <!-- Delete set -->
                                        <button @click="removeSet(exIndex, setIndex)" class="text-zinc-600 hover:text-red-400 p-1">
                                            <i data-lucide="minus-circle" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Add Set Button (+) without text -->
                            <button @click="addSet(exIndex)" class="w-full py-2 bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] rounded-xl text-zinc-300 flex items-center justify-center transition active:scale-95">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>

                    </div>
                </template>

                <!-- Add Exercise Button -->
                <button @click="addExerciseRow()" class="w-full py-3 bg-[#161b22] border border-[#30363d] hover:bg-[#21262d] rounded-2xl text-xs font-semibold text-white flex items-center justify-center space-x-2 transition active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4 text-zinc-400"></i>
                    <span>Новое упражнение</span>
                </button>
            </div>

            <!-- Modal Footer -->
            <div class="pt-2 flex space-x-2">
                <button @click="clearDayData()" class="px-4 py-2.5 rounded-xl bg-[#21262d] border border-[#30363d] text-red-400 text-xs font-semibold hover:bg-red-500/10 transition">
                    Очистить
                </button>
                <button @click="saveDayData()" class="flex-1 py-2.5 rounded-xl bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] text-white text-xs font-bold transition">
                    Сохранить
                </button>
            </div>

        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div x-show="openSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
        <div @click.away="openSettings = false" class="bg-[#161b22] border border-[#30363d] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl modal-enter">
            <div class="flex items-center justify-between border-b border-[#30363d] pb-3">
                <h3 class="font-bold text-white text-base">Настройки и приватность</h3>
                <button @click="openSettings = false" class="p-1 rounded-full bg-[#21262d] text-zinc-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs text-zinc-300 leading-relaxed">
                <p class="text-zinc-400">
                    <strong class="text-white">Приватность:</strong> Все данные хранятся исключительно в памяти твоего браузера (LocalStorage). Никакие сервера их не собирают и не видят.
                </p>
                <p class="text-zinc-400">
                    Ты можешь в любой момент сделать экспорт файла с данными или импортировать его на другое устройство.
                </p>
                <div class="flex space-x-2 pt-1">
                    <button @click="exportData()" class="flex-1 py-2.5 rounded-xl bg-[#0d1117] border border-[#30363d] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Экспорт</span>
                    </button>
                    <label class="flex-1 py-2.5 rounded-xl bg-[#0d1117] border border-[#30363d] hover:bg-[#21262d] text-white font-medium flex items-center justify-center space-x-2 transition cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span>Импорт</span>
                        <input type="file" @change="importData" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <div class="border-t border-[#30363d] pt-3 flex justify-end">
                <button @click="openSettings = false" class="px-4 py-2 rounded-xl bg-[#21262d] border border-[#30363d] text-white text-xs font-bold">
                    Готово
                </button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        function trackerApp() {
            return {
                workouts: {},
                viewMode: 'year', // Default to year as requested
                currentDate: new Date(),
                todayStr: '',
                openModal: false,
                openSettings: false,
                selectedDate: '',
                activeDayExercises: [],
                
                dragging: false,
                dragStartY: 0,
                dragStartVal: 0,
                dragExIndex: null,
                dragSetIndex: null,

                init() {
                    // Restore saved data
                    const saved = localStorage.getItem('gym_streak_data_v4');
                    if (saved) {
                        try { this.workouts = JSON.parse(saved); } catch (e) {}
                    }

                    // Restore last view mode if saved
                    const savedView = localStorage.getItem('gym_view_mode');
                    if (savedView) {
                        this.viewMode = savedView;
                    }

                    const today = new Date();
                    this.todayStr = this.formatDateIso(today);
                    this.selectedDate = this.todayStr;

                    this.$nextTick(() => lucide.createIcons());
                    this.$watch('viewMode', () => this.$nextTick(() => lucide.createIcons()));
                    this.$watch('openModal', () => this.$nextTick(() => lucide.createIcons()));

                    // Drag listeners for reps
                    window.addEventListener('mousemove', (e) => this.onDrag(e.clientY));
                    window.addEventListener('mouseup', () => this.stopDrag());
                    window.addEventListener('touchmove', (e) => {
                        if (this.dragging && e.touches.length > 0) {
                            this.onDrag(e.touches[0].clientY);
                        }
                    }, { passive: true });
                    window.addEventListener('touchend', () => this.stopDrag());
                },

                setViewMode(mode) {
                    this.viewMode = mode;
                    localStorage.setItem('gym_view_mode', mode);
                },

                startDrag(e, exIdx, setIdx) {
                    this.dragging = true;
                    this.dragStartY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                    this.dragStartVal = Number(this.activeDayExercises[exIdx].setsList[setIdx].reps || 0);
                    this.dragExIndex = exIdx;
                    this.dragSetIndex = setIdx;
                },

                onDrag(clientY) {
                    if (!this.dragging || this.dragExIndex === null || this.dragSetIndex === null) return;
                    let diff = Math.floor((this.dragStartY - clientY) / 10);
                    let newVal = this.dragStartVal + diff;
                    if (newVal < 0) newVal = 0;
                    if (newVal > 999) newVal = 999;
                    this.activeDayExercises[this.dragExIndex].setsList[this.dragSetIndex].reps = newVal;
                },

                stopDrag() {
                    this.dragging = false;
                    this.dragExIndex = null;
                    this.dragSetIndex = null;
                },

                saveToStorage() {
                    localStorage.setItem('gym_streak_data_v4', JSON.stringify(this.workouts));
                },

                formatDateIso(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },

                formatDateHuman(dateStr) {
                    if (!dateStr) return '';
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const date = new Date(y, m - 1, d);
                    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
                },

                isToday(dateStr) {
                    return dateStr === this.todayStr;
                },

                // Intensity logic: 0 = dark gray, 1-25 = light green, 26-60 = mid green, 61-100 = bright green, 101+ = max green
                getIntensity(dateStr) {
                    const dayExs = this.workouts[dateStr];
                    if (!dayExs || !dayExs.length) return 0;
                    
                    let totalReps = 0;
                    dayExs.forEach(ex => {
                        if (ex.setsList) {
                            ex.setsList.forEach(s => totalReps += Number(s.reps || 0));
                        }
                    });

                    if (totalReps === 0) return 0;
                    if (totalReps <= 25) return 1;
                    if (totalReps <= 60) return 2;
                    if (totalReps <= 100) return 3;
                    return 4;
                },

                getColorClass(intensity) {
                    switch (intensity) {
                        case 1: return 'bg-github-1';
                        case 2: return 'bg-github-2';
                        case 3: return 'bg-github-3';
                        case 4: return 'bg-github-4';
                        default: return 'bg-github-0';
                    }
                },

                get dateRangeTitle() {
                    const y = this.currentDate.getFullYear();
                    const m = this.currentDate.getMonth();
                    if (this.viewMode === 'week') return `Неделя (${y})`;
                    if (this.viewMode === 'month') {
                        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
                        return `${months[m]} ${y}`;
                    }
                    return `${y} год`;
                },

                shiftDate(direction) {
                    const d = new Date(this.currentDate);
                    if (this.viewMode === 'week') d.setDate(d.getDate() + (direction * 7));
                    else if (this.viewMode === 'month') d.setMonth(d.getMonth() + direction);
                    else d.setFullYear(d.getFullYear() + direction);
                    this.currentDate = d;
                },

                get currentWeekDays() {
                    let d = new Date(this.currentDate);
                    let dayOfWeek = d.getDay();
                    let distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    d.setDate(d.getDate() + distanceToMonday);

                    let days = [];
                    const names = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
                    for (let i = 0; i < 7; i++) {
                        let dateStr = this.formatDateIso(d);
                        let totalR = 0;
                        if (this.workouts[dateStr]) {
                            this.workouts[dateStr].forEach(ex => ex.setsList?.forEach(s => totalR += Number(s.reps || 0)));
                        }
                        days.push({
                            dateStr: dateStr,
                            dayName: names[i],
                            dayNum: d.getDate(),
                            intensity: this.getIntensity(dateStr),
                            totalReps: totalR
                        });
                        d.setDate(d.getDate() + 1);
                    }
                    return days;
                },

                get currentMonthGrid() {
                    let y = this.currentDate.getFullYear();
                    let m = this.currentDate.getMonth();
                    let firstDayOfMonth = new Date(y, m, 1);
                    let lastDayOfMonth = new Date(y, m + 1, 0);
                    let startingDayOfWeek = firstDayOfMonth.getDay();
                    let startIndex = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;
                    
                    let grid = [];
                    for (let i = 0; i < startIndex; i++) grid.push({ empty: true });

                    for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                        let dateObj = new Date(y, m, i);
                        let dateStr = this.formatDateIso(dateObj);
                        grid.push({
                            empty: false,
                            dateStr: dateStr,
                            dayNum: i,
                            intensity: this.getIntensity(dateStr)
                        });
                    }
                    return grid;
                },

                get yearDaysList() {
                    let y = this.currentDate.getFullYear();
                    let startDate = new Date(y, 0, 1);
                    let endDate = new Date(y, 11, 31);
                    let list = [];
                    let curr = new Date(startDate);
                    while (curr <= endDate) {
                        let dateStr = this.formatDateIso(curr);
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensity(dateStr)
                        });
                        curr.setDate(curr.getDate() + 1);
                    }
                    return list;
                },

                selectDay(dateStr) {
                    if (!dateStr) return;
                    this.selectedDate = dateStr;
                    const existing = this.workouts[dateStr];
                    if (existing && existing.length > 0) {
                        this.activeDayExercises = JSON.parse(JSON.stringify(existing));
                    } else {
                        this.activeDayExercises = [
                            { name: 'Отжимания', setsList: [{reps: 0}] }
                        ];
                    }
                    this.openModal = true;
                },

                addExerciseRow() {
                    this.activeDayExercises.push({ name: 'Приседания', setsList: [{reps: 0}] });
                },

                removeExercise(index) {
                    this.activeDayExercises.splice(index, 1);
                },

                addSet(exIndex) {
                    this.activeDayExercises[exIndex].setsList.push({ reps: 0 });
                },

                removeSet(exIndex, setIndex) {
                    this.activeDayExercises[exIndex].setsList.splice(setIndex, 1);
                    if (this.activeDayExercises[exIndex].setsList.length === 0) {
                        this.removeExercise(exIndex);
                    }
                },

                adjustReps(exIndex, setIndex, delta) {
                    let current = Number(this.activeDayExercises[exIndex].setsList[setIndex].reps || 0);
                    current += delta;
                    if (current < 0) current = 0;
                    if (current > 999) current = 999;
                    this.activeDayExercises[exIndex].setsList[setIndex].reps = current;
                },

                clearDayData() {
                    delete this.workouts[this.selectedDate];
                    this.saveToStorage();
                    this.openModal = false;
                },

                saveDayData() {
                    this.activeDayExercises = this.activeDayExercises.filter(ex => ex.setsList && ex.setsList.length > 0);
                    if (this.activeDayExercises.length > 0) {
                        this.workouts[this.selectedDate] = JSON.parse(JSON.stringify(this.activeDayExercises));
                    } else {
                        delete this.workouts[this.selectedDate];
                    }
                    this.saveToStorage();
                    this.openModal = false;
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.workouts, null, 2));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `gym_backup.json`);
                    dlAnchorElem.click();
                },

                importData(event) {
                    const fileReader = new FileReader();
                    if (event.target.files[0]) {
                        fileReader.readAsText(event.target.files[0], "UTF-8");
                        fileReader.onload = (e) => {
                            try {
                                this.workouts = JSON.parse(e.target.result);
                                this.saveToStorage();
                                alert('Успешно!');
                                this.openSettings = false;
                            } catch (err) { alert('Ошибка файла'); }
                        };
                    }
                }
            }
        }
    </script>
</body>
